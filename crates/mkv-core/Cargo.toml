[package]
name = "mkv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core anime fansub batch processing and media engine"

[lints]
workspace = true

[dependencies]
regex = "1.10"
fancy-regex = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
blake2 = "0.10"
parking_lot = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "process", "macros", "io-util", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bench]]
name = "bench_pipeline"
harness = false

[[bench]]
name = "bench_real_media"
harness = false
