[package]
name = "mkv-cli"
version = "0.1.0"
edition = "2021"
description = "CLI adapter for mkv-core batch processing engine"

[dependencies]
mkv-core = { path = "../mkv-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
