[workspace]
resolver = "2"
members = [
    "crates/mkv-core",
    "crates/mkv-cli",
    "crates/mkv-desktop-core",
    "desktop-tauri/src-tauri",
]
[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["sifahaz"]
license = "MIT"
repository = "https://github.com/Si-Forces/mkvanimebatch"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
incremental = true

[profile.release]
# Keep the default `panic = "unwind"`: engine workers and the desktop bridge isolate panics as
# task `JoinError`s, which `panic = "abort"` would turn into process exits.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
