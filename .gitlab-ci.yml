# GitLab port of .github/workflows/ci.yml. release.yml stays on GitHub Actions, which still
# receives every push through the GitLab push mirror. Pipeline success replaces the
# `ci-status` gate job that ADR-0010 requires: protect main with "Pipelines must succeed".
# Unlike ADR-0010's always-on gate, the Rust jobs skip pipelines that change no Rust input
# (see .rust-job), so a docs-only MR passes on ui-tests and security-audit alone. Windows MRs
# smoke-test only the debug mkv-cli.exe; the release build and its smoke test run on main.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    # Like the GitHub workflow, a newer push cancels an older MR pipeline but never a main one.
    # Only main pipelines write the caches; see JOB_CACHE_POLICY.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
      variables:
        JOB_CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
      variables:
        JOB_CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == "web"
      auto_cancel:
        on_new_commit: none

default:
  interruptible: true

variables:
  # CARGO_HOME inside the project so the registry can be cached (.cargo/ holds audit.toml).
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_INCREMENTAL: "0"
  # The first Windows `cargo test` exited without an error while building test binaries,
  # most likely out of memory on the 7.5 GB runner. Line tables instead of full debuginfo cut
  # compiler and linker memory, keep backtrace line numbers, and shrink every job's cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  # Protected and unprotected refs share caches (separate caches are off), so only main
  # pipelines write them (workflow rules set pull-push). MRs and manual runs on other branches
  # only read main's: no upload wait, and no branch can poison the cache main builds from.
  JOB_CACHE_POLICY: pull
  # target/ makes the cache large; fast zipping cuts its upload time.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest

.rust-job:
  # Only Rust inputs trigger the Rust jobs, so docs-only MRs skip them. MR pipelines compare
  # against the target branch, pushes to main against the previous push; manual pipelines
  # always run them.
  rules:
    - changes: &rust-inputs
        - crates/**/*
        - desktop-tauri/src-tauri/**/*
        # snapshot.rs tests read these fixtures.
        - desktop-tauri/ui/fixtures/**/*
        # generate_context! parses it for the CSP at compile time.
        - desktop-tauri/ui/index.html
        - Cargo.toml
        - Cargo.lock
        - .cargo/**/*
        - .gitlab-ci.yml
  # One stable key per job: a Cargo.lock bump keeps the warm target/ and cargo's fingerprints
  # rebuild what changed. Clear runner caches in CI/CD > Pipelines if it grows too large.
  cache:
    key: $CI_JOB_NAME
    policy: $JOB_CACHE_POLICY
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - target/

# ──────────────────────────────────────────────────────────────────────────────
# 1. Rust workspace checks (Linux and Windows)
# ──────────────────────────────────────────────────────────────────────────────
rust-linux:
  extends: .rust-job
  image: rust:1-trixie
  # 8 vCPU / 32 GB needs Premium or Ultimate. If the GitLab trial lapses, drop the tag to fall
  # back to the free saas-linux-small-amd64, or the job stays pending.
  tags: [saas-linux-large-amd64]
  # The job runs as root, so test_promote_file_readonly_source_parent_returns_error skips here;
  # GitHub's non-root runner still covers it.
  variables:
    # The real-media regression fails instead of skipping when FFmpeg/MKVToolNix are missing.
    MKV_REQUIRE_MEDIA_TOOLS: "1"
  before_script:
    - apt-get update -y
    - >
      apt-get install -y --no-install-recommends
      pkg-config file libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg mkvtoolnix
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
    # The real-media bench runs its self-check asserts, then skips because MKV_BENCH_CORPUS
    # is unset. `cargo test --workspace` does not build bench targets.
    - cargo test -p mkv-core --bench bench_real_media
    - cargo build --release -p mkv-cli
    - |
      CLI=./target/release/mkv-cli
      test -s "$CLI"
      "$CLI" --help >/dev/null
      EMPTY="$(mktemp -d)"
      "$CLI" --plan --no-cache --input-dir "$EMPTY" > "$EMPTY/manifest.json"
      grep -q '"version": 2' "$EMPTY/manifest.json"
      grep -q '"items": \[\]' "$EMPTY/manifest.json"

# GitLab-hosted Windows runners are beta, PowerShell-only, take ~5 min to provision and
# ship MSVC Build Tools but no Rust.
.windows-job:
  extends: .rust-job
  tags: [saas-windows-medium-amd64]
  # A cold cache on 2 vCPU can outrun GitLab's 60-minute default (GitHub allowed 6 h).
  timeout: 2h
  before_script:
    - $ProgressPreference = "SilentlyContinue"
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"

# Smoke-tests target\$CLI_PROFILE\mkv-cli.exe. The runner checks $? after every line, which a
# pipe or an assignment hides, so the checks read $LASTEXITCODE themselves.
.windows-cli-smoke:
  script:
    - $cli = ".\target\$env:CLI_PROFILE\mkv-cli.exe"
    - if (-not (Test-Path $cli) -or (Get-Item $cli).Length -eq 0) { throw "mkv-cli.exe is missing or empty" }
    - '& $cli --help > $null; if ($LASTEXITCODE) { throw "mkv-cli --help exited $LASTEXITCODE" }'
    - $empty = New-Item -ItemType Directory -Path (Join-Path $env:TEMP "mkv-empty-$(Get-Random)")
    - $manifest = (& $cli --plan --no-cache --input-dir $empty.FullName) -join "`n"
    - if ($LASTEXITCODE) { throw "mkv-cli --plan exited $LASTEXITCODE" }
    - |
      if ($manifest -notmatch '"version": 2' -or $manifest -notmatch '"items": \[\]') { throw "unexpected manifest: $manifest" }

rust-windows:
  extends: .windows-job
  variables:
    # cargo test builds the debug mkv-cli.exe for CARGO_BIN_EXE.
    CLI_PROFILE: debug
  cache:
    # Debug artifacts only: release ones belong to rust-windows-release's cache.
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - target/debug/
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings
    # MKV_REQUIRE_MEDIA_TOOLS stays unset: the real-media regression skips on Windows.
    - cargo test --workspace
    - !reference [.windows-cli-smoke, script]

# Release builds (LTO, codegen-units = 1) take ~20 min on 2 vCPU with a warm cache, so they
# get their own job: it runs in parallel with rust-windows, only on main and manual pipelines,
# and keeps its own cache so MR pipelines don't download release artifacts.
rust-windows-release:
  extends: .windows-job
  variables:
    CLI_PROFILE: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "web"
      changes: *rust-inputs
  script:
    - cargo build --release -p mkv-cli
    - !reference [.windows-cli-smoke, script]
    - cargo build --release -p mkv-anime-batch

# ──────────────────────────────────────────────────────────────────────────────
# 2. Frontend UI state and contract tests
# ──────────────────────────────────────────────────────────────────────────────
ui-tests:
  image: node:20-slim
  script:
    - node --check desktop-tauri/ui/app.js
    - node --test desktop-tauri/ui/*.test.js

# ──────────────────────────────────────────────────────────────────────────────
# 3. Security audit (honours .cargo/audit.toml)
# ──────────────────────────────────────────────────────────────────────────────
security-audit:
  image: rust:1-trixie
  cache:
    key: cargo-audit
    policy: $JOB_CACHE_POLICY
    paths:
      - .cargo-home/bin/
      # cargo install's own records: without them it refuses to overwrite the cached binary.
      - .cargo-home/.crates.toml
      - .cargo-home/.crates2.json
  script:
    # Built once, then reused from the cache; `cargo install` rebuilds only on a new release.
    - cargo install cargo-audit --locked
    - $CARGO_HOME/bin/cargo-audit audit
