<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKV Anime Batch - UI Prototypes Showcase Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Showcase Bar */
    .hub-header {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .hub-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hub-badge {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
    }

    .hub-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Prototype Switcher Tabs */
    .proto-switcher {
      display: flex;
      gap: 8px;
      background: #030712;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid #1f2937;
    }

    .proto-tab {
      background: transparent;
      border: none;
      color: #9ca3af;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .proto-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .proto-tab.active {
      background: #1f2937;
      color: #38bdf8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Meta bar */
    .meta-bar {
      background: #151d2a;
      border-bottom: 1px solid #1f2937;
      padding: 10px 24px;
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .meta-tags {
      display: flex;
      gap: 12px;
    }

    .meta-chip {
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: #cbd5e1;
    }

    /* Main Viewport Container */
    .viewport-container {
      flex: 1;
      position: relative;
      background: #030712;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="hub-header">
    <div class="hub-title-group">
      <span class="hub-badge">5 DESIGN PROTOTYPES</span>
      <span class="hub-title">MKV Anime Batch UI Showcase</span>
    </div>

    <!-- Prototype Selector Tabs -->
    <nav class="proto-switcher">
      <button class="proto-tab active" onclick="loadProto('proto1_cyber_neon.html', 'Cyber Neon / Anime HUD', 'High-tech neon cyan/magenta HUD aesthetic with live telemetry meters & glowing status badges.', this)">
        <span>1. Cyber Neon</span>
      </button>

      <button class="proto-tab" onclick="loadProto('proto2_tokyo_glass.html', 'Tokyo Glass / Minimalist Studio', 'Ultra-sleek frosted glass (backdrop-blur) with smooth indigo/sakura gradients.', this)">
        <span>2. Tokyo Glass</span>
      </button>

      <button class="proto-tab" onclick="loadProto('proto3_nordic_frost.html', 'Nordic Frost / Studio Ghibli Clean', 'Deep navy slate & ice blue/mint accents with clean visual cards & soft steppers.', this)">
        <span>3. Nordic Frost</span>
      </button>

      <button class="proto-tab" onclick="loadProto('proto4_oled_pro.html', 'OLED Command Deck / Pro Workstation', 'True OLED pitch black layout with pro media transcode matrices & hardware resource gauges.', this)">
        <span>4. OLED Pro</span>
      </button>

      <button class="proto-tab" onclick="loadProto('proto5_retro_terminal.html', 'Vaporwave / Retro 90s Cyberpunk', 'Nostalgic 90s NERV/Evangelion terminal vibe with CRT scanlines & retro mechanical controls.', this)">
        <span>5. Retro Synth</span>
      </button>
    </nav>

    <div>
      <a id="fullscreen-btn" href="proto1_cyber_neon.html" target="_blank" style="color:#38bdf8; text-decoration:none; font-size:0.85rem; font-weight:600; display:flex; align-items:center; gap:6px;">
        ↗ Open Fullscreen
      </a>
    </div>
  </header>

  <!-- Description Bar -->
  <div class="meta-bar">
    <div>
      <strong id="proto-title" style="color:#fff; margin-right:12px;">Cyber Neon / Anime HUD</strong>
      <span id="proto-desc">High-tech neon cyan/magenta HUD aesthetic with live telemetry meters & glowing status badges.</span>
    </div>
    <div class="meta-tags">
      <span class="meta-chip" id="proto-chip1">HEX: #00f0ff</span>
      <span class="meta-chip" id="proto-chip2">FONT: Orbitron / Outfit</span>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="viewport-container">
    <iframe id="proto-frame" src="proto1_cyber_neon.html"></iframe>
  </main>

  <script>
    function loadProto(url, title, desc, btnEl) {
      document.getElementById('proto-frame').src = url;
      document.getElementById('fullscreen-btn').href = url;
      document.getElementById('proto-title').innerText = title;
      document.getElementById('proto-desc').innerText = desc;

      document.querySelectorAll('.proto-tab').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');

      if (url.includes('proto1')) {
        document.getElementById('proto-chip1').innerText = 'HEX: #00f0ff';
        document.getElementById('proto-chip2').innerText = 'FONT: Orbitron / JetBrains';
      } else if (url.includes('proto2')) {
        document.getElementById('proto-chip1').innerText = 'GLASS: Blur 24px';
        document.getElementById('proto-chip2').innerText = 'FONT: Plus Jakarta Sans';
      } else if (url.includes('proto3')) {
        document.getElementById('proto-chip1').innerText = 'THEME: Slate / Mint';
        document.getElementById('proto-chip2').innerText = 'FONT: Space Grotesk / Outfit';
      } else if (url.includes('proto4')) {
        document.getElementById('proto-chip1').innerText = 'PRO: OLED #050505';
        document.getElementById('proto-chip2').innerText = 'FONT: JetBrains Mono';
      } else if (url.includes('proto5')) {
        document.getElementById('proto-chip1').innerText = 'RETRO: 90s CRT';
        document.getElementById('proto-chip2').innerText = 'FONT: VT323 / Fira Code';
      }
    }
  </script>
</body>
</html>
