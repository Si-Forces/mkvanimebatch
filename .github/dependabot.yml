version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and its version comment.
  # One grouped PR on purpose: a few build-only actions, validated together by one CI run,
  # are not worth a PR each. Bisect inside the group if a bump breaks CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
