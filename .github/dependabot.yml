version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and its version comment.
  # dtolnay/rust-toolchain has no releases, so its "# master" pin is bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
