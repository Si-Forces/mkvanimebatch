name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Release Verification: Rust Workspace Checks
  # ────────────────────────────────────────────────────────────────────────────
  workspace-checks:
    name: Verify Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check Rust formatting (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust workspace unit and integration tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo test -p mkv-core -p mkv-cli --verbose
          else
            cargo test --workspace --verbose
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Release Verification: Frontend UI State & Contract Tests
  # ────────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: Verify UI State & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run UI syntax and contract tests
        run: |
          node --check desktop-tauri/ui/app.js
          node --test desktop-tauri/ui/*.test.js

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Release Verification Gate
  # ────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: Release Verification Gate
    needs: [workspace-checks, ui-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate verification status
        run: |
          if [ "${{ needs.workspace-checks.result }}" != "success" ] || \
             [ "${{ needs.ui-tests.result }}" != "success" ]; then
            echo "Release verification failed! Aborting release build."
            exit 1
          fi
          echo "All release verification checks passed!"

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Desktop GUI & CLI Build — Windows (Runs ONLY after verification passes)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build & Release — Windows
    needs: [ci-status]
    if: needs.ci-status.result == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Compile mkv-cli (Release)
        run: cargo build --release -p mkv-cli

      - name: Smoke-test mkv-cli
        shell: pwsh
        run: |
          $Cli = "target\release\mkv-cli.exe"
          if (-not (Test-Path $Cli) -or (Get-Item $Cli).Length -eq 0) {
            throw "Built mkv-cli is empty or missing"
          }
          & $Cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mkv-cli --help failed" }
          $Empty = Join-Path $env:RUNNER_TEMP "empty-release"
          New-Item -ItemType Directory -Force -Path $Empty | Out-Null
          $Manifest = (& $Cli --plan --no-cache --input-dir $Empty) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $Manifest.version -ne 2 -or $Manifest.items.Count -ne 0 -or $null -eq $Manifest.subtitle_candidates) {
            throw "mkv-cli empty-directory plan contract failed"
          }

      - name: Package Windows CLI Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\mkv-cli.exe dist\
          Compress-Archive -Path dist\mkv-cli.exe -DestinationPath mkv-cli-x86_64-pc-windows-msvc.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 mkv-cli-x86_64-pc-windows-msvc.zip).Hash.ToLower()
          "$hash  mkv-cli-x86_64-pc-windows-msvc.zip" | Out-File -Encoding utf8 "mkv-cli-x86_64-pc-windows-msvc.zip.sha256"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: desktop-tauri
        run: cargo tauri build --no-bundle

      # ── Package Windows Artifacts (Portable Zip & Standalone Exe) ────────────
      - name: Package Windows Desktop Artifacts
        shell: pwsh
        run: |
          $ReleaseExe = Get-ChildItem -Path . -Filter "mkv-anime-batch.exe" -Recurse | Where-Object { $_.FullName -like "*release*" -and $_.FullName -notlike "*windows-artifacts*" } | Select-Object -First 1
          if (-not $ReleaseExe) {
            throw "mkv-anime-batch.exe not found after tauri build"
          }
          $ReleaseDir = $ReleaseExe.DirectoryName
          $OutDir     = "windows-artifacts"
          $StageDir   = "mkv-anime-batch-windows-x64"

          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null

          # Copy single self-contained standalone executable
          Copy-Item "$ReleaseDir\mkv-anime-batch.exe" "$OutDir\mkv-anime-batch.exe" -Force

          # Copy main executable into portable package
          Copy-Item "$ReleaseDir\mkv-anime-batch.exe" "$StageDir\" -Force

          # Create Portable Zip
          Compress-Archive -Path "$StageDir\*" -DestinationPath "$OutDir\MKV_Anime_Batch_Portable_win64.zip" -Force

          foreach ($Artifact in @(
            "$OutDir\mkv-anime-batch.exe",
            "$OutDir\MKV_Anime_Batch_Portable_win64.zip",
            "mkv-cli-x86_64-pc-windows-msvc.zip",
            "mkv-cli-x86_64-pc-windows-msvc.zip.sha256"
          )) {
            if (-not (Test-Path $Artifact) -or (Get-Item $Artifact).Length -eq 0) {
              throw "Missing or empty packaged artifact: $Artifact"
            }
          }

      - name: Resolve Release Tag
        id: release-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.version_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Windows files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "MKV Anime Batch ${{ steps.release-tag.outputs.tag }}"
          body: |
            ## 🪟 Windows

            | File | Description |
            |------|-------------|
            | `mkv-anime-batch.exe` | Single self-contained standalone desktop GUI executable |
            | `MKV_Anime_Batch_Portable_win64.zip` | Portable Zip package (self-contained GUI) |
            | `mkv-cli-x86_64-pc-windows-msvc.zip` | Standalone native CLI executable (includes `.sha256`) |

            ---

            ## 🐧 Linux

            | File | Description |
            |------|-------------|
            | `MKV_Anime_Batch_*_amd64.AppImage` | Universal AppImage — works on any modern Linux distro |
            | `MKV_Anime_Batch_*_amd64.deb` | Debian / Ubuntu package |
            | `MKV_Anime_Batch_*_x86_64.rpm` | Fedora / RedHat / SUSE package |
            | `mkv-cli-x86_64-unknown-linux-gnu.tar.gz` | Standalone native CLI executable (includes `.sha256`) |

            ---

            ### 🚀 Quick Start (CLI)

            ```bash
            # Inspect releases and generate Manifest v2 JSON
            ./mkv-cli --input-dir "/path/to/anime/series" --plan

            # Dry-run batch remuxing simulation
            ./mkv-cli --input-dir "/path/to/anime/series" --dry-run
            ```

            ---

            ### ⚙️ External Prerequisites
            Ensure the following command-line tools are installed and in your `PATH`:
            - `mkvmerge` & `mkvextract` (from [MKVToolNix](https://mkvtoolnix.download/))
            - `ffmpeg` (for Opus audio transcoding, from [ffmpeg.org](https://ffmpeg.org/))
          files: |
            windows-artifacts/mkv-anime-batch.exe
            windows-artifacts/MKV_Anime_Batch_Portable_win64.zip
            mkv-cli-x86_64-pc-windows-msvc.zip
            mkv-cli-x86_64-pc-windows-msvc.zip.sha256
          draft: false
          prerelease: false

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Desktop GUI & CLI Build — Linux (Runs ONLY after verification passes)
  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build & Release — Linux
    needs: [ci-status]
    if: needs.ci-status.result == 'success'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Linux system deps ─────────────────────────────────────────────────────
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file rpm \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Rust + Tauri ─────────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Compile mkv-cli (Release)
        run: cargo build --release -p mkv-cli

      - name: Smoke-test mkv-cli
        run: |
          CLI="target/release/mkv-cli"
          test -s "$CLI"
          "$CLI" --help >/dev/null
          EMPTY="$(mktemp -d)"
          trap 'rm -rf "$EMPTY"' EXIT
          "$CLI" --plan --no-cache --input-dir "$EMPTY" > "$EMPTY/manifest.json"

      - name: Package Linux CLI Archive
        run: |
          mkdir -p dist
          cp target/release/mkv-cli dist/
          cd dist
          tar -czvf ../mkv-cli-x86_64-unknown-linux-gnu.tar.gz mkv-cli
          cd ..
          sha256sum mkv-cli-x86_64-unknown-linux-gnu.tar.gz > mkv-cli-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: desktop-tauri
        run: cargo tauri build --config src-tauri/tauri.linux.conf.json --bundles appimage,deb,rpm

      # ── Flatten + Collect Bundles ────────────────────────────────────────────
      - name: Collect Linux bundles
        run: |
          mkdir -p /tmp/linux-release
          find target desktop-tauri -type f -name "*.AppImage" -exec cp {} /tmp/linux-release/ \;
          find target desktop-tauri -type f -name "*.deb" -exec cp {} /tmp/linux-release/ \;
          find target desktop-tauri -type f -name "*.rpm" -exec cp {} /tmp/linux-release/ \;

      - name: Verify Linux packages
        run: |
          DEB="$(find /tmp/linux-release -name '*.deb' -print -quit)"
          RPM="$(find /tmp/linux-release -name '*.rpm' -print -quit)"
          APPIMAGE="$(find /tmp/linux-release -name '*.AppImage' -print -quit)"
          test -n "$DEB" && test -n "$RPM" && test -n "$APPIMAGE"

          dpkg-deb --contents "$DEB" > /tmp/deb-contents.txt
          grep -q 'bin/mkv-anime-batch' /tmp/deb-contents.txt

          rpm -qlp "$RPM" > /tmp/rpm-contents.txt
          grep -q 'bin/mkv-anime-batch' /tmp/rpm-contents.txt

          chmod +x "$APPIMAGE"
          mkdir -p /tmp/appimage-contents
          (cd /tmp/appimage-contents && "$APPIMAGE" --appimage-extract >/dev/null)
          find /tmp/appimage-contents/squashfs-root -name 'mkv-anime-batch' -type f -print -quit | grep -q .

      - name: Resolve Release Tag
        id: release-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.version_tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Linux bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: "MKV Anime Batch ${{ steps.release-tag.outputs.tag }}"
          body: |
            ## 🪟 Windows

            | File | Description |
            |------|-------------|
            | `mkv-anime-batch.exe` | Single self-contained standalone desktop GUI executable |
            | `MKV_Anime_Batch_Portable_win64.zip` | Portable Zip package (self-contained GUI) |
            | `mkv-cli-x86_64-pc-windows-msvc.zip` | Standalone native CLI executable (includes `.sha256`) |

            ---

            ## 🐧 Linux

            | File | Description |
            |------|-------------|
            | `MKV_Anime_Batch_*_amd64.AppImage` | Universal AppImage — works on any modern Linux distro |
            | `MKV_Anime_Batch_*_amd64.deb` | Debian / Ubuntu package |
            | `MKV_Anime_Batch_*_x86_64.rpm` | Fedora / RedHat / SUSE package |
            | `mkv-cli-x86_64-unknown-linux-gnu.tar.gz` | Standalone native CLI executable (includes `.sha256`) |

            ---

            ### 🚀 Quick Start (CLI)

            ```bash
            # Inspect releases and generate Manifest v2 JSON
            ./mkv-cli --input-dir "/path/to/anime/series" --plan

            # Dry-run batch remuxing simulation
            ./mkv-cli --input-dir "/path/to/anime/series" --dry-run
            ```

            ---

            ### ⚙️ External Prerequisites
            Ensure the following command-line tools are installed and in your `PATH`:
            - `mkvmerge` & `mkvextract` (from [MKVToolNix](https://mkvtoolnix.download/))
            - `ffmpeg` (for Opus audio transcoding, from [ffmpeg.org](https://ffmpeg.org/))
          files: |
            /tmp/linux-release/*.AppImage
            /tmp/linux-release/*.deb
            /tmp/linux-release/*.rpm
            mkv-cli-x86_64-unknown-linux-gnu.tar.gz
            mkv-cli-x86_64-unknown-linux-gnu.tar.gz.sha256
          draft: false
          prerelease: false
