name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# A tag push leaves inputs.version_tag empty, so this falls back to the pushed tag.
env:
  RELEASE_TAG: ${{ inputs.version_tag || github.ref_name }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Release Verification: the full CI workflow, including its status gate
  # ────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    # A release usually starts on a cold cache: Windows verify took up to 23.5 minutes (issue #95).
    with:
      windows-timeout: 35

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Release Notes and Version Check
  # ────────────────────────────────────────────────────────────────────────────
  # Fail before any build if the release page could not be generated: build-linux
  # needs a "## <version>" section in docs/release-notes.md (pre-release tags too),
  # and the bundle names it lists come from the workspace version.
  release-notes:
    name: Check Release Notes and Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A dispatch input reaches the ::error:: lines below, so refuse anything that is not
      # a plain version tag (a newline in it could inject workflow commands).
      - name: Check release notes and version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::the release tag is not of the form v<version>"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          scripts/release-body.sh notes "$version" > /dev/null
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $RELEASE_TAG does not match the workspace version $cargo_version"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Desktop GUI & CLI Build — Windows (Runs ONLY after verification passes)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build & Release — Windows
    needs: [verify, release-notes]
    # The image ci.yml verifies on, though without its Dev Drive.
    runs-on: windows-2025
    # The first build of a release is usually a rust-cache miss: cold builds took 19-36
    # minutes (issue #95). A killed release build costs the release, so leave headroom.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup ships on the runner images, so this needs no third-party action.
      - name: Install Rust stable
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-pc-windows-msvc

      - name: Compile mkv-cli (Release)
        run: cargo build --release -p mkv-cli

      - name: Smoke-test mkv-cli
        shell: pwsh
        run: |
          $Cli = "target\release\mkv-cli.exe"
          if (-not (Test-Path $Cli) -or (Get-Item $Cli).Length -eq 0) {
            throw "Built mkv-cli is empty or missing"
          }
          & $Cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mkv-cli --help failed" }
          $Empty = Join-Path $env:RUNNER_TEMP "empty-release"
          New-Item -ItemType Directory -Force -Path $Empty | Out-Null
          $Manifest = (& $Cli --plan --no-cache --input-dir $Empty) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $Manifest.version -ne 2 -or $Manifest.items.Count -ne 0 -or $null -eq $Manifest.subtitle_candidates) {
            throw "mkv-cli empty-directory plan contract failed"
          }

      - name: Package Windows CLI Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\mkv-cli.exe dist\
          Compress-Archive -Path dist\mkv-cli.exe -DestinationPath mkv-cli-x86_64-pc-windows-msvc.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 mkv-cli-x86_64-pc-windows-msvc.zip).Hash.ToLower()
          "$hash  mkv-cli-x86_64-pc-windows-msvc.zip" | Out-File -Encoding utf8 "mkv-cli-x86_64-pc-windows-msvc.zip.sha256"

      # Not in install-action's manifest, so it falls back to cargo-binstall, which fetches
      # Tauri's prebuilt cargo-tauri. If no prebuilt binary matches, cargo-binstall compiles
      # it, which is as slow as the old cargo install. cargo-binstall reads "2" as ^2 (latest
      # 2.x at build time), which excludes v3 pre-releases.
      - name: Install tauri-cli
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: tauri-cli@2

      - name: Build Tauri app
        working-directory: desktop-tauri
        run: cargo tauri build --no-bundle

      # ── Package Windows Artifacts (Portable Zip & Standalone Exe) ────────────
      - name: Package Windows Desktop Artifacts
        shell: pwsh
        run: |
          $ReleaseExe = Get-ChildItem -Path . -Filter "mkv-anime-batch.exe" -Recurse | Where-Object { $_.FullName -like "*release*" -and $_.FullName -notlike "*windows-artifacts*" } | Select-Object -First 1
          if (-not $ReleaseExe) {
            throw "mkv-anime-batch.exe not found after tauri build"
          }
          $ReleaseDir = $ReleaseExe.DirectoryName
          $OutDir     = "windows-artifacts"
          $StageDir   = "mkv-anime-batch-windows-x64"

          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null

          # Copy single self-contained standalone executable
          Copy-Item "$ReleaseDir\mkv-anime-batch.exe" "$OutDir\mkv-anime-batch.exe" -Force

          # Copy main executable into portable package
          Copy-Item "$ReleaseDir\mkv-anime-batch.exe" "$StageDir\" -Force

          # Create Portable Zip
          Compress-Archive -Path "$StageDir\*" -DestinationPath "$OutDir\MKV_Anime_Batch_Portable_win64.zip" -Force

          foreach ($Artifact in @(
            "$OutDir\mkv-anime-batch.exe",
            "$OutDir\MKV_Anime_Batch_Portable_win64.zip",
            "mkv-cli-x86_64-pc-windows-msvc.zip",
            "mkv-cli-x86_64-pc-windows-msvc.zip.sha256"
          )) {
            if (-not (Test-Path $Artifact) -or (Get-Item $Artifact).Length -eq 0) {
              throw "Missing or empty packaged artifact: $Artifact"
            }
          }

      # Uploads assets only. build-linux runs in parallel on the same tag and is
      # the sole owner of the release name and body (see "Publish Linux bundles
      # to release"), so leaving them unset here avoids a last-writer-wins race.
      - name: Publish Windows files to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            windows-artifacts/mkv-anime-batch.exe
            windows-artifacts/MKV_Anime_Batch_Portable_win64.zip
            mkv-cli-x86_64-pc-windows-msvc.zip
            mkv-cli-x86_64-pc-windows-msvc.zip.sha256
          draft: false
          prerelease: false

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Desktop GUI & CLI Build — Linux (Runs ONLY after verification passes)
  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build & Release — Linux
    needs: [verify, release-notes]
    runs-on: ubuntu-24.04
    # Cold builds took 16-21 minutes (issue #95); the apt step alone is bounded at about 9.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Linux system deps ─────────────────────────────────────────────────────
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          install-recommends: "true"
          packages: >-
            build-essential curl wget file rpm libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # ── Rust + Tauri ─────────────────────────────────────────────────────────
      # rustup ships on the runner images, so this needs no third-party action.
      - name: Install Rust stable
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Compile mkv-cli (Release)
        run: cargo build --release -p mkv-cli

      - name: Smoke-test mkv-cli
        run: |
          CLI="target/release/mkv-cli"
          test -s "$CLI"
          "$CLI" --help >/dev/null
          EMPTY="$(mktemp -d)"
          trap 'rm -rf "$EMPTY"' EXIT
          "$CLI" --plan --no-cache --input-dir "$EMPTY" > "$EMPTY/manifest.json"
          grep -q '"version": 2' "$EMPTY/manifest.json"
          grep -q '"items": \[\]' "$EMPTY/manifest.json"

      - name: Package Linux CLI Archive
        run: |
          mkdir -p dist
          cp target/release/mkv-cli dist/
          cd dist
          tar -czvf ../mkv-cli-x86_64-unknown-linux-gnu.tar.gz mkv-cli
          cd ..
          sha256sum mkv-cli-x86_64-unknown-linux-gnu.tar.gz > mkv-cli-x86_64-unknown-linux-gnu.tar.gz.sha256

      # Prebuilt via cargo-binstall; see the same step in build-windows.
      - name: Install tauri-cli
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: tauri-cli@2

      # tauri.linux.conf.json is merged automatically when building on Linux.
      - name: Build Tauri app
        working-directory: desktop-tauri
        run: cargo tauri build --bundles appimage,deb,rpm

      # ── Flatten + Collect Bundles ────────────────────────────────────────────
      - name: Collect Linux bundles
        run: |
          mkdir -p /tmp/linux-release
          find target desktop-tauri -type f -name "*.AppImage" -exec cp {} /tmp/linux-release/ \;
          find target desktop-tauri -type f -name "*.deb" -exec cp {} /tmp/linux-release/ \;
          find target desktop-tauri -type f -name "*.rpm" -exec cp {} /tmp/linux-release/ \;
          # Tauri keeps the spaces of productName, which GitHub would turn into dots on upload.
          for f in /tmp/linux-release/*' '*; do
            if [ -e "$f" ]; then mv "$f" "${f// /_}"; fi
          done

      - name: Verify Linux packages and record AppImage runtime
        id: verify-linux
        shell: bash
        run: |
          DEB="$(find /tmp/linux-release -name '*.deb' -print -quit)"
          RPM="$(find /tmp/linux-release -name '*.rpm' -print -quit)"
          APPIMAGE="$(find /tmp/linux-release -name '*.AppImage' -print -quit)"
          test -n "$DEB" && test -n "$RPM" && test -n "$APPIMAGE"

          dpkg-deb --contents "$DEB" > /tmp/deb-contents.txt
          grep -q 'bin/mkv-anime-batch' /tmp/deb-contents.txt

          rpm -qlp "$RPM" > /tmp/rpm-contents.txt
          grep -q 'bin/mkv-anime-batch' /tmp/rpm-contents.txt

          chmod +x "$APPIMAGE"
          mkdir -p /tmp/appimage-contents
          (cd /tmp/appimage-contents && "$APPIMAGE" --appimage-extract >/dev/null)
          find /tmp/appimage-contents/squashfs-root -name 'mkv-anime-batch' -type f -print -quit | grep -q .

          # The AppImage bundles its own GTK/WebKitGTK, copied off this runner,
          # so its rendering behavior is decided by the runner image rather than
          # by this repo. See ADR-0015: an AppImage whose WebKitGTK reaches the
          # 2.54 transparent-window behavior inherits a rendering bug that the
          # DMABUF workaround itself causes, on the NVIDIA hosts that still get
          # it. Record what we actually bundled so a bad release is diagnosable
          # instead of mysterious.
          #
          # Versions come from dpkg, not from the .so: the bundled libwebkit2gtk
          # carries no greppable version string. Fail loudly rather than shipping
          # a manifest with a blank version.
          #
          # `appdir` here is the extracted AppImage's root, not the AppImage
          # runtime's own APPDIR env var, which apply_linux_env() keys the
          # DMABUF scoping off (ADR-0015). The two are unrelated; keep them
          # apart.
          appdir=/tmp/appimage-contents/squashfs-root
          libdir=$appdir/usr/lib
          if [ ! -d "$appdir" ]; then
            echo "::error::AppDir $appdir does not exist; the AppImage did not extract"
            exit 1
          fi
          manifest=/tmp/linux-release/APPIMAGE-RUNTIME.txt

          {
            echo "AppImage bundled runtime"
            echo "recorded: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "see docs/adr/0015-per-package-webkitgtk-dmabuf-renderer-scoping.md"
            echo
            printf '%-30s %-24s %s\n' SONAME VERSION BUNDLED
          } > "$manifest"

          # Each entry is dpkg-package-name:soname. These are different namespaces:
          # the soname is what we assert is bundled, the package name is what
          # dpkg can report a version for. They are not interchangeable -- the
          # soname base of libwebkit2gtk is `libwebkit2gtk-4.1`, but its Ubuntu
          # 24.04 package is `libwebkit2gtk-4.1-0`, and `dpkg-query` on the
          # former returns nothing at all rather than erroring. The third field
          # names the step output this entry feeds, so the loop never has to
          # re-derive identity from a soname after the fact.
          for entry in \
            "libwebkit2gtk-4.1-0:libwebkit2gtk-4.1.so.0:webkit_version" \
            "libjavascriptcoregtk-4.1-0:libjavascriptcoregtk-4.1.so.0:jsc_version" \
            "libgtk-3-0t64:libgtk-3.so.0:gtk_version"; do
            pkg="${entry%%:*}"
            rest="${entry#*:}"
            soname="${rest%%:*}"
            output="${rest##*:}"

            # Search the whole AppDir rather than one hardcoded libdir: the
            # bundler's layout is not this file's to predict, and a wrong guess
            # here would fail a release that is actually fine, for a reason that
            # has nothing to do with the runtime it is trying to record.
            if [ -e "$libdir/$soname" ] ||
               [ -n "$(find "$appdir" -name "$soname" -print -quit 2>/dev/null)" ]; then
              bundled=yes
            else
              bundled=NO
            fi

            version="$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)"
            if [ -z "$version" ]; then
              echo "::error::could not determine the version of $pkg on the build runner"
              exit 1
            fi

            printf '%-30s %-24s %s\n' "$soname" "$version" "$bundled" >> "$manifest"

            # A missing bundle is not cosmetic. Without its own WebKitGTK the
            # AppImage falls back to the host's, and on a host carrying the 2.54
            # transparent-window behavior the DMABUF workaround this packaging
            # applies on NVIDIA hosts becomes the cause of ADR-0015's rendering
            # bug. Fail the release rather than shipping that silently.
            if [ "$bundled" = "NO" ]; then
              echo "::error::$soname is not bundled in the AppImage; it would fall back to the host runtime"
              exit 1
            fi

            echo "$output=$version" >> "$GITHUB_OUTPUT"
          done

          cat "$manifest"

      # Builds the release page. The prose for this version comes from
      # docs/release-notes.md; the rest is generic or filled from the verified
      # AppImage runtime versions.
      - name: Build release body
        shell: bash
        env:
          WEBKIT: ${{ steps.verify-linux.outputs.webkit_version }}
          JSC: ${{ steps.verify-linux.outputs.jsc_version }}
          GTK: ${{ steps.verify-linux.outputs.gtk_version }}
        run: |
          version="${RELEASE_TAG#v}"
          scripts/release-body.sh page "$version" /tmp/linux-release > "$RUNNER_TEMP/release-body.md"

      # Sole owner of the release's name and body. The body documents both
      # platforms because one release carries both platforms' assets, and it
      # embeds the AppImage runtime versions that only this job can compute.
      # build-windows runs in parallel and uploads assets without touching the
      # body, so the outcome does not depend on which job finishes first.
      - name: Publish Linux bundles to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "MKV Anime Batch ${{ env.RELEASE_TAG }}"
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            /tmp/linux-release/*.AppImage
            /tmp/linux-release/*.deb
            /tmp/linux-release/*.rpm
            /tmp/linux-release/APPIMAGE-RUNTIME.txt
            mkv-cli-x86_64-unknown-linux-gnu.tar.gz
            mkv-cli-x86_64-unknown-linux-gnu.tar.gz.sha256
          draft: false
          prerelease: false
