name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.platform }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python + PyInstaller ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      # ── Build sidecars ─────────────────────────────────────────────────────
      - name: Build sidecars (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $OutDir = "desktop-tauri/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          $Triple = "x86_64-pc-windows-msvc"
          python -m PyInstaller --onefile --console `
            --name "mkv-remux-$Triple" `
            --distpath $OutDir `
            --workpath "pyinstaller-work-remux" `
            --specpath "pyinstaller-spec-remux" `
            --noconfirm mkv_remux_fast.py
          python -m PyInstaller --onefile --console `
            --name "mkv-extract-$Triple" `
            --distpath $OutDir `
            --workpath "pyinstaller-work-extract" `
            --specpath "pyinstaller-spec-extract" `
            --noconfirm mkv_extract_fast.py

      - name: Build sidecars (Linux)
        if: matrix.platform == 'linux'
        run: |
          OUT="desktop-tauri/src-tauri/binaries"
          TRIPLE="x86_64-unknown-linux-gnu"
          mkdir -p "$OUT"
          python3 -m PyInstaller --onefile --console \
            --name "mkv-remux-$TRIPLE" \
            --distpath "$OUT" \
            --workpath /tmp/pyinstaller-work-remux \
            --specpath /tmp/pyinstaller-spec-remux \
            --noconfirm mkv_remux_fast.py
          python3 -m PyInstaller --onefile --console \
            --name "mkv-extract-$TRIPLE" \
            --distpath "$OUT" \
            --workpath /tmp/pyinstaller-work-extract \
            --specpath /tmp/pyinstaller-spec-extract \
            --noconfirm mkv_extract_fast.py

      # ── Rust + Tauri CLI ───────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-tauri/src-tauri -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # ── Linux system deps ──────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Build Tauri app ────────────────────────────────────────────────────
      - name: Build Tauri app
        working-directory: desktop-tauri
        run: cargo tauri build

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Windows bundles
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mkv-anime-batch-windows
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Linux bundles
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mkv-anime-batch-linux
          path: |
            desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
