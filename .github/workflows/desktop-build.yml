name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Windows build → raw portable exe
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    name: Build — Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python + PyInstaller (sidecars) ──────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build sidecars
        shell: pwsh
        run: |
          $OutDir = "desktop-tauri/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          $Triple = "x86_64-pc-windows-msvc"
          python -m PyInstaller --onefile --console `
            --name "mkv-remux-$Triple" `
            --distpath $OutDir `
            --workpath "pyinstaller-work-remux" `
            --specpath "pyinstaller-spec-remux" `
            --noconfirm mkv_remux_fast.py
          python -m PyInstaller --onefile --console `
            --name "mkv-extract-$Triple" `
            --distpath $OutDir `
            --workpath "pyinstaller-work-extract" `
            --specpath "pyinstaller-spec-extract" `
            --noconfirm mkv_extract_fast.py

      # ── Rust + Tauri ─────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-tauri/src-tauri -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: desktop-tauri
        run: cargo tauri build

      # ── Package Windows Artifacts (Portable Zip & Installer) ───────────
      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $ReleaseDir = "desktop-tauri/src-tauri/target/release"
          $BundleDir  = "desktop-tauri/src-tauri/target/release/bundle"
          $OutDir     = "windows-artifacts"
          $StageDir   = "mkv-anime-batch-windows-x64"

          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null

          # Copy single self-contained standalone executable
          Copy-Item "$ReleaseDir\mkv-anime-batch.exe" "$OutDir\mkv-anime-batch.exe" -Force

          # Copy main executable and sidecars into portable package
          Copy-Item "$ReleaseDir\mkv-anime-batch.exe" "$StageDir\" -Force
          Copy-Item "desktop-tauri/src-tauri/binaries\mkv-remux-x86_64-pc-windows-msvc.exe" "$StageDir\" -Force
          Copy-Item "desktop-tauri/src-tauri/binaries\mkv-extract-x86_64-pc-windows-msvc.exe" "$StageDir\" -Force

          # Create Portable Zip
          Compress-Archive -Path "$StageDir\*" -DestinationPath "$OutDir\MKV_Anime_Batch_Portable_win64.zip" -Force

          # Collect NSIS setup installer if generated
          if (Test-Path "$BundleDir\nsis\*.exe") {
              Get-ChildItem "$BundleDir\nsis\*.exe" | ForEach-Object {
                  Copy-Item $_.FullName "$OutDir\MKV_Anime_Batch_Setup_x64.exe" -Force
              }
          }

          # Collect MSI installer if generated
          if (Test-Path "$BundleDir\msi\*.msi") {
              Get-ChildItem "$BundleDir\msi\*.msi" | ForEach-Object {
                  Copy-Item $_.FullName "$OutDir\" -Force
              }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: windows-artifacts/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Linux build → AppImage + deb
  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    name: Build — Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python + PyInstaller (sidecars) ──────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build sidecars
        run: |
          OUT="desktop-tauri/src-tauri/binaries"
          TRIPLE="x86_64-unknown-linux-gnu"
          mkdir -p "$OUT"
          python3 -m PyInstaller --onefile --console \
            --name "mkv-remux-$TRIPLE" \
            --distpath "$OUT" \
            --workpath /tmp/pyinstaller-work-remux \
            --specpath /tmp/pyinstaller-spec-remux \
            --noconfirm mkv_remux_fast.py
          python3 -m PyInstaller --onefile --console \
            --name "mkv-extract-$TRIPLE" \
            --distpath "$OUT" \
            --workpath /tmp/pyinstaller-work-extract \
            --specpath /tmp/pyinstaller-spec-extract \
            --noconfirm mkv_extract_fast.py

      # ── Linux system deps ─────────────────────────────────────────────────────
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Rust + Tauri ─────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-tauri/src-tauri -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app
        working-directory: desktop-tauri
        run: cargo tauri build --config src-tauri/tauri.linux.conf.json

      # ── Flatten + Upload AppImage + deb ──────────────────────────────────────
      - name: Collect Linux bundles
        run: |
          mkdir -p /tmp/linux-release
          find desktop-tauri/src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} /tmp/linux-release/ \;
          find desktop-tauri/src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} /tmp/linux-release/ \;

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: /tmp/linux-release/
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # Collect both artifacts → publish GitHub Release
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets/windows

      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: release-assets/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MKV Anime Batch ${{ github.ref_name }}"
          body: |
            ## 🪟 Windows

            | File | Description |
            |------|-------------|
            | `mkv-anime-batch.exe` | Single self-contained standalone executable — download & run anywhere! |
            | `MKV_Anime_Batch_Portable_win64.zip` | Portable Zip package |
            | `MKV_Anime_Batch_Setup_x64.exe` | Windows Installer (NSIS Setup) |

            > **Requirements:** [MKVToolNix](https://mkvtoolnix.download/) and [ffmpeg](https://ffmpeg.org/download.html) must be installed and available on `PATH`.

            ---

            ## 🐧 Linux

            | File | Description |
            |------|-------------|
            | `MKV_Anime_Batch_*_amd64.AppImage` | Universal AppImage — works on any modern Linux distro |
            | `MKV_Anime_Batch_*_amd64.deb` | Debian / Ubuntu package |

            ### 📦 Linux Installation & Dependencies

            #### Option A: `.deb` Package (Debian / Ubuntu / Mint)
            ```bash
            sudo apt update
            sudo apt install ./MKV_Anime_Batch_*_amd64.deb mkvtoolnix ffmpeg
            ```

            #### Option B: `.AppImage` (Universal)
            ```bash
            chmod +x MKV_Anime_Batch_*_amd64.AppImage
            ./MKV_Anime_Batch_*_amd64.AppImage
            ```

            > **CLI Tools Requirement:** Make sure `mkvtoolnix` (`mkvmerge`, `mkvextract`) and `ffmpeg` are installed (`sudo apt install mkvtoolnix ffmpeg`).
          files: |
            release-assets/windows/*
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
          draft: false
          prerelease: false
