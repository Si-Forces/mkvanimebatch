name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Python Code Quality & Type Checking
  # ────────────────────────────────────────────────────────────────────────────
  python-quality:
    name: Python Quality & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies for typechecking
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check Python syntax compilation
        run: |
          python -m py_compile mkv_common.py mkv_assets.py mkv_extract.py mkv_remux.py

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Pyright Type Checker
        run: |
          npx --yes pyright

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Python Unit Tests Matrix (Linux & Windows x Python 3.10–3.13)
  # ────────────────────────────────────────────────────────────────────────────
  python-tests:
    name: Python Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest test suite
        run: |
          pytest tests/ --tb=short -v

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Rust & Tauri Desktop Engine Checks (Linux & Windows)
  # ────────────────────────────────────────────────────────────────────────────
  rust-tauri-checks:
    name: Tauri Engine Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Create placeholder sidecar binaries
        shell: bash
        run: |
          mkdir -p desktop-tauri/src-tauri/binaries
          touch desktop-tauri/src-tauri/binaries/mkv-remux-x86_64-unknown-linux-gnu
          touch desktop-tauri/src-tauri/binaries/mkv-extract-x86_64-unknown-linux-gnu
          touch desktop-tauri/src-tauri/binaries/mkv-remux-x86_64-pc-windows-msvc.exe
          touch desktop-tauri/src-tauri/binaries/mkv-extract-x86_64-pc-windows-msvc.exe

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-tauri/src-tauri -> target"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop-tauri/src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --manifest-path desktop-tauri/src-tauri/Cargo.toml -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml --verbose

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Frontend UI State & Contract Tests
  # ────────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: UI State & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run UI contract tests
        run: |
          node --test desktop-tauri/ui/*.test.js

  # ────────────────────────────────────────────────────────────────────────────
  # 5. CI Completion Gate (Required Check Summary)
  # ────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status Gate
    needs: [python-quality, python-tests, rust-tauri-checks, ui-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate status
        run: |
          if [ "${{ needs.python-quality.result }}" != "success" ] || \
             [ "${{ needs.python-tests.result }}" != "success" ] || \
             [ "${{ needs.rust-tauri-checks.result }}" != "success" ] || \
             [ "${{ needs.ui-tests.result }}" != "success" ]; then
            echo "CI pipeline checks failed!"
            exit 1
          fi
          echo "All CI pipeline checks passed successfully!"
