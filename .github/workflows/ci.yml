name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # release.yml runs this workflow as its verification stage, with a longer Windows
  # timeout for its usually cold cache. PR CI leaves it unset and gets 20 minutes.
  workflow_call:
    inputs:
      windows-timeout:
        description: timeout-minutes for the Windows leg.
        type: number
      # release.yml sets it, so the unreleased Slint port never gates a Tauri release (#133).
      skip-desktop-slint:
        description: Skip the Slint desktop host job.
        type: boolean
        default: false

# A called workflow sees the caller's github context, so without the "ci-" prefix this
# group would equal release.yml's own, and GitHub would cancel the run as a concurrency deadlock.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# dtolnay/rust-toolchain used to set this; keep backtraces in failing test logs.
env:
  RUST_BACKTRACE: short

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Rust Workspace Checks (Linux Ubuntu 24.04 & Windows)
  # ────────────────────────────────────────────────────────────────────────────
  # Windows runs on GitHub-hosted runners, free for a public repo. A trial in PR #108 timed
  # warm runs: this split layout on windows-2025 with a Dev Drive took about 213 s, the old
  # single job on blacksmith-2vcpu-windows-2025 222 s, and the same split on Blacksmith
  # 147 s. Blacksmith's 3,000 free minutes (Windows counts 1.5x) could not cover the split.
  workspace-checks:
    name: Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Warm runs take 2-3 minutes and a cold Windows run about 7.5. The apt step once stalled
    # for 30 minutes; without a timeout GitHub waits 6 hours. The "|| 20" keeps a matrix
    # entry without a timeout from silently getting those 6 hours.
    timeout-minutes: ${{ matrix.timeout || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            timeout: ${{ inputs.windows-timeout }}
    # Line tables keep backtraces readable while shrinking the debug info that MSVC links
    # slowly and that rust-cache has to download.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Dev Drive copy of the workspace on Windows; cargo steps run in $BUILD_DIR.
      - name: Set up the build directory
        uses: ./.github/actions/setup-build-dir

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          packages: >-
            build-essential curl wget file libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev
            libayatana-appindicator3-dev librsvg2-dev patchelf ffmpeg mkvtoolnix

      # rustup ships on the runner images, so this needs no third-party action.
      - name: Install Rust stable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy --target "$TARGET"
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          workspaces: ${{ env.BUILD_DIR }}

      - name: Check Rust formatting (Linux only)
        if: runner.os == 'Linux'
        working-directory: ${{ env.BUILD_DIR }}
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        working-directory: ${{ env.BUILD_DIR }}
        run: cargo clippy --workspace --exclude mkv-anime-batch-slint --exclude mkv-anime-batch-slint-ui --all-targets -- -D warnings

      # The Desktop Core stays toolkit-agnostic (ADR-0016 decision 1). The tree is captured first,
      # so a failing `cargo tree` fails the step and `grep -q` cannot SIGPIPE it under pipefail.
      - name: Check the Desktop Core does not depend on a UI toolkit (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          deps="$(cargo tree -p mkv-desktop-core -e normal --prefix none)"
          if grep -qiE '^(tauri|slint|i-slint|winit|skia)' <<< "$deps"; then
            echo "::error::mkv-desktop-core depends on a UI toolkit (tauri, slint, winit or skia); ADR-0016 keeps the Desktop Core toolkit-agnostic."
            exit 1
          fi

      # `MKV_REQUIRE_MEDIA_TOOLS=1` makes the real-media regression fail instead of
      # skipping when FFmpeg/MKVToolNix are missing. Windows keeps the local skip.
      - name: Run Rust workspace unit and integration tests
        working-directory: ${{ env.BUILD_DIR }}
        env:
          MKV_REQUIRE_MEDIA_TOOLS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace --exclude mkv-anime-batch-slint --exclude mkv-anime-batch-slint-ui

      # The real-media bench never runs a cell here: it runs its self-check asserts, then skips
      # because MKV_BENCH_CORPUS is unset. `cargo test --workspace` does not build bench targets.
      - name: Self-check the real-media bench (Linux only)
        if: runner.os == 'Linux'
        working-directory: ${{ env.BUILD_DIR }}
        run: cargo test -p mkv-core --bench bench_real_media

      - name: Build Standalone mkv-cli Binary (Release)
        working-directory: ${{ env.BUILD_DIR }}
        run: cargo build --release -p mkv-cli

      - name: Smoke Test CLI Executable
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          CLI="./target/release/mkv-cli${{ runner.os == 'Windows' && '.exe' || '' }}"
          test -s "$CLI"
          "$CLI" --help >/dev/null
          EMPTY="$(mktemp -d 2>/dev/null || mktemp -d -t 'empty')"
          trap 'rm -rf "$EMPTY"' EXIT
          "$CLI" --plan --no-cache --input-dir "$EMPTY" > "$EMPTY/manifest.json"
          grep -q '"version": 2' "$EMPTY/manifest.json"
          grep -q '"items": \[\]' "$EMPTY/manifest.json"

  # ────────────────────────────────────────────────────────────────────────────
  # 1b. Slint Desktop Host (Linux Ubuntu 24.04 & Windows), ADR-0017
  # ────────────────────────────────────────────────────────────────────────────
  # The Slint port builds beside the Tauri app until the switch. Its own job and cache keep the
  # Skia prebuilt download and the Slint tree out of workspace-checks. skia-bindings has the
  # no-compile feature, so a failed prebuilt download fails the build instead of a source build.
  desktop-slint:
    name: Slint Desktop Host (${{ matrix.os }})
    if: ${{ !inputs.skip-desktop-slint }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            timeout: ${{ inputs.windows-timeout }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build directory
        uses: ./.github/actions/setup-build-dir

      # Skia links libstdc++, fontconfig and freetype; the rest (EGL, Wayland, X11, xkbcommon)
      # is loaded at run time.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          packages: >-
            build-essential libfontconfig-dev libfreetype-dev

      - name: Install Rust stable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target "$TARGET"
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-slint-${{ matrix.target }}
          workspaces: ${{ env.BUILD_DIR }}

      - name: Run Clippy linter
        working-directory: ${{ env.BUILD_DIR }}
        run: cargo clippy -p mkv-anime-batch-slint -p mkv-anime-batch-slint-ui --all-targets -- -D warnings

      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        run: cargo test -p mkv-anime-batch-slint -p mkv-anime-batch-slint-ui

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Windows Desktop Release Build
  # ────────────────────────────────────────────────────────────────────────────
  # Runs beside workspace-checks rather than after it in the same job, so the Windows leg
  # takes the longer of the two instead of their sum (about 3.5 minutes warm).
  windows-desktop:
    name: Desktop Release Build (windows-2025)
    runs-on: windows-2025
    # The trial measured 7 minutes cold and 3.5 warm.
    timeout-minutes: ${{ inputs.windows-timeout || 20 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Dev Drive copy of the workspace on Windows; cargo steps run in $BUILD_DIR.
      - name: Set up the build directory
        uses: ./.github/actions/setup-build-dir

      # rustup ships on the runner images, so this needs no third-party action.
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.BUILD_DIR }}

      - name: Build Desktop App Binary (Windows Release)
        working-directory: ${{ env.BUILD_DIR }}
        run: cargo build --release -p mkv-anime-batch

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Frontend UI and Script Tests
  # ────────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: UI and Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run UI syntax checks and the UI and script tests
        run: |
          node --check desktop-tauri/ui/app.js
          node --test scripts/*.test.js desktop-tauri/ui/*.test.js

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Workflow Lint (actionlint, which also runs shellcheck on run: scripts)
  # ────────────────────────────────────────────────────────────────────────────
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go and shellcheck ship on the runner image; the Go checksum database pins the module.
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Security Audit (Cargo Audit with audit.toml)
  # ────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: Run Cargo Audit
        run: cargo audit

  # ────────────────────────────────────────────────────────────────────────────
  # 6. CI Completion Gate (Required Check Summary for Branch Protection)
  # ────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status Gate
    needs: [workspace-checks, desktop-slint, windows-desktop, ui-tests, workflow-lint, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Evaluate status
        run: |
          if [ "${{ needs.workspace-checks.result }}" != "success" ] || \
             { [ "${{ needs.desktop-slint.result }}" != "success" ] && \
               [ "${{ needs.desktop-slint.result }}" != "skipped" ]; } || \
             [ "${{ needs.windows-desktop.result }}" != "success" ] || \
             [ "${{ needs.ui-tests.result }}" != "success" ] || \
             [ "${{ needs.workflow-lint.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "CI pipeline checks failed!"
            exit 1
          fi
          echo "All CI pipeline checks passed successfully!"
