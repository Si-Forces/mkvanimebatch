name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Rust Workspace Checks (Linux Ubuntu 24.04 & Windows)
  # ────────────────────────────────────────────────────────────────────────────
  workspace-checks:
    name: Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg \
            mkvtoolnix

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check Rust formatting (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust workspace unit and integration tests
        run: cargo test --workspace --verbose

      - name: Build Standalone mkv-cli Binary (Release)
        run: cargo build --release -p mkv-cli

      - name: Smoke Test CLI Executable
        shell: bash
        run: |
          CLI="./target/release/mkv-cli${{ runner.os == 'Windows' && '.exe' || '' }}"
          test -s "$CLI"
          "$CLI" --help >/dev/null
          EMPTY="$(mktemp -d 2>/dev/null || mktemp -d -t 'empty')"
          trap 'rm -rf "$EMPTY"' EXIT
          "$CLI" --plan --no-cache --input-dir "$EMPTY" > "$EMPTY/manifest.json"
          grep -q '"version": 2' "$EMPTY/manifest.json"
          grep -q '"items": \[\]' "$EMPTY/manifest.json"

      - name: Build Desktop App Binary (Windows Release)
        if: runner.os == 'Windows'
        run: cargo build --release -p mkv-anime-batch

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Frontend UI State & Contract Tests
  # ────────────────────────────────────────────────────────────────────────────
  ui-tests:
    name: UI State & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run UI syntax and contract tests
        run: |
          node --check desktop-tauri/ui/app.js
          node --test desktop-tauri/ui/*.test.js

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Security Audit (Cargo Audit with audit.toml)
  # ────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Cargo Audit
        run: cargo audit

  # ────────────────────────────────────────────────────────────────────────────
  # 4. CI Completion Gate (Required Check Summary for Branch Protection)
  # ────────────────────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status Gate
    needs: [workspace-checks, ui-tests, security-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate status
        run: |
          if [ "${{ needs.workspace-checks.result }}" != "success" ] || \
             [ "${{ needs.ui-tests.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "CI pipeline checks failed!"
            exit 1
          fi
          echo "All CI pipeline checks passed successfully!"
