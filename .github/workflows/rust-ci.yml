name: Rust CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feat/rust-engine-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-checks:
    name: Rust Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy -p mkv-core -p mkv-cli --tests -- -D warnings

      - name: Run Rust Test Suite
        run: cargo test -p mkv-core -p mkv-cli -- --nocapture

      - name: Build Standalone mkv-cli Binary (Release)
        run: cargo build --release -p mkv-cli

      - name: Smoke Test CLI Executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/mkv-cli.exe --help
          else
            ./target/release/mkv-cli --help
          fi
