# Configuration for cargo-audit and RustSec advisory scanning
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
ignore = [
    # RUSTSEC-2024-0429: Unsoundness in Iterator/DoubleEndedIterator impls for glib::VariantStrIter
    # Upstream constraint: Tauri v2 Linux webview stack relies on GTK 3 (gtk 0.18 / glib 0.18).
    # Upstream fix was released in glib 0.20 (GTK 4), which is an incompatible semver bump for GTK 3.
    # Impact: Zero. Neither mkvanimebatch nor the desktop bridge references VariantStrIter.
    "RUSTSEC-2024-0429",

    # RUSTSEC-2024-0370: proc-macro-error is unmaintained
    # Upstream constraint: Build-time procedural macro dependency used by gtk3-macros and glib-macros.
    # Impact: Informational warning only; no runtime or vulnerability impact.
    "RUSTSEC-2024-0370",

    # RUSTSEC-2025-0075: unic-char-range is unmaintained
    # RUSTSEC-2025-0080: unic-common is unmaintained
    # RUSTSEC-2025-0081: unic-char-property is unmaintained
    # RUSTSEC-2025-0098: unic-ucd-version is unmaintained
    # RUSTSEC-2025-0100: unic-ucd-ident is unmaintained
    # Upstream constraint: Pulled in by urlpattern 0.3.0 which is required by tauri-utils 2.9.x.
    # The rust-unic crates were archived upstream; urlpattern 0.6 migrated to icu_properties.
    # Impact: Informational warning only; no security vulnerability.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]
