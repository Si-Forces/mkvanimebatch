[package]
name = "mkv-anime-batch-slint"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Batch anime fansub processing desktop application (Slint host, ADR-0017)"
publish = false

[lints]
workspace = true

[dependencies]
mkv-desktop-core = { path = "../crates/mkv-desktop-core" }
# `PipelineMode` and, in the Intent-order test, the fake Inspector's manifest.
mkv-core = { path = "../crates/mkv-core" }
# The host's own runtime for the Desktop Core actor and its jobs; the core enables only `rt`.
tokio = { version = "1", features = ["rt-multi-thread"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
# The generated UI (`App`), in its own crate because of its `unsafe_code` lint (ADR-0017 amendment).
mkv-anime-batch-slint-ui = { path = "ui" }

# Slint's version and features are the workspace's (root Cargo.toml), shared with ui/Cargo.toml.
# Cargo.lock: gpu-allocator (via Skia's wgpu-30) must resolve `windows` 0.62, as wgpu-hal does. Its
# range also allows 0.61, which Tauri's tao and wry hold, and the resolver reuses that; the Windows
# build then fails in wgpu-hal (E0277, two `windows_core`). The desktop-slint CI job checks it
# ("gpu-allocator and wgpu-hal share one windows crate"); after a `cargo update` that fails, point
# gpu-allocator's `windows` entry in Cargo.lock back at wgpu-hal's version.
slint = { workspace = true }

# The folder picker (XDG portal on Linux, as the Tauri host's), and the GPU fallback dialog's
# MessageBoxW on Windows; Linux runs zenity or kdialog for that dialog itself (renderer.rs).
rfd = "0.15"
# Copy in the Run Log drawer: Slint has no app-level clipboard call (only its backends' own,
# which drop the write's error). Already in the tree through Slint's winit backend.
arboard = { version = "3.6", default-features = false }

# Copy on Wayland without XWayland: declared here, not left to what Slint's backend selects.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# XDG Settings portal read for Reduce motion; already in the tree through Slint's winit backend.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
# Windows registry read for Reduce transparency (`EnableTransparency`).
winreg = "0.55"
# Reads the OS motion preference Slint's winit backend already mirrors into `SlintContext`.
i-slint-core = { workspace = true }

# The Windows exe's icon and version resources (build.rs), as the Tauri host's tauri-build does.
[build-dependencies]
tauri-winres = "0.3"

[dev-dependencies]
# `renderer-software`: headless snapshots for the font test.
i-slint-backend-testing = { workspace = true, features = ["renderer-software"] }
tempfile = "3"
# Sets the system's colour scheme, inspects mouse cursors and walks item trees in ui_tests
# (no public API does).
i-slint-core = { workspace = true }

# The FrameStats bench (P2, reused by P7 and the P9 gate): run by hand, never by `cargo test`.
[[bench]]
name = "queue_scroll"
harness = false

# Linux packaging metadata (ADR-0017 decision 7 & 2026-11-27 amendment).
# The binary dlopens EGL/GL, Wayland, X11/xcb/Xcursor/Xi and xkbcommon at runtime, so automatic
# shlib/ELF discovery misses them; both packages declare them explicitly (Vulkan is omitted).
[package.metadata.deb]
name = "mkv-anime-batch-slint"
section = "video"
priority = "optional"
license-file = ["../LICENSE", "0"]
depends = "$auto, libegl1, libgl1, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxkbcommon0, libxkbcommon-x11-0"
assets = [
    ["target/release/mkv-anime-batch-slint", "usr/bin/", "755"],
    ["packaging/mkv-anime-batch-slint.desktop", "usr/share/applications/", "644"],
    ["icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/mkv-anime-batch-slint.png", "644"],
    ["icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/mkv-anime-batch-slint.png", "644"],
    ["icons/128x128@2x.png", "usr/share/icons/hicolor/256x256/apps/mkv-anime-batch-slint.png", "644"],
    ["icons/icon.png", "usr/share/icons/hicolor/512x512/apps/mkv-anime-batch-slint.png", "644"],
    ["icons/icon.svg", "usr/share/icons/hicolor/scalable/apps/mkv-anime-batch-slint.svg", "644"],
    ["ui/fonts/OFL-JetBrainsMono.txt", "usr/share/doc/mkv-anime-batch-slint/", "644"],
    ["ui/fonts/OFL-Onest.txt", "usr/share/doc/mkv-anime-batch-slint/", "644"],
    ["ui/fonts/OFL-Unbounded.txt", "usr/share/doc/mkv-anime-batch-slint/", "644"],
    ["../LICENSE", "usr/share/doc/mkv-anime-batch-slint/", "644"],
]

[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/mkv-anime-batch-slint", dest = "/usr/bin/mkv-anime-batch-slint", mode = "755" },
    { source = "packaging/mkv-anime-batch-slint.desktop", dest = "/usr/share/applications/mkv-anime-batch-slint.desktop", mode = "644" },
    { source = "icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/mkv-anime-batch-slint.png", mode = "644" },
    { source = "icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/mkv-anime-batch-slint.png", mode = "644" },
    { source = "icons/128x128@2x.png", dest = "/usr/share/icons/hicolor/256x256/apps/mkv-anime-batch-slint.png", mode = "644" },
    { source = "icons/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/mkv-anime-batch-slint.png", mode = "644" },
    { source = "icons/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/mkv-anime-batch-slint.svg", mode = "644" },
    { source = "ui/fonts/OFL-JetBrainsMono.txt", dest = "/usr/share/licenses/mkv-anime-batch-slint/OFL-JetBrainsMono.txt", mode = "644" },
    { source = "ui/fonts/OFL-Onest.txt", dest = "/usr/share/licenses/mkv-anime-batch-slint/OFL-Onest.txt", mode = "644" },
    { source = "ui/fonts/OFL-Unbounded.txt", dest = "/usr/share/licenses/mkv-anime-batch-slint/OFL-Unbounded.txt", mode = "644" },
    { source = "../LICENSE", dest = "/usr/share/licenses/mkv-anime-batch-slint/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libxcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
