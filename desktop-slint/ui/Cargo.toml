[package]
name = "mkv-anime-batch-slint-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The generated Slint UI of the MKV Anime Batch Slint host (ADR-0017)"
publish = false

# Not `workspace = true`: the generated code needs `#[allow(unsafe_code)]`, which `forbid` refuses
# (E0453). `deny` still rejects any unsafe code not under that allow (ADR-0017, 2026-10-23 amendment).
[lints.rust]
unsafe_code = "deny"

# The same Slint rev and features as the host (ADR-0017 decisions 2 and 3); bump them together.
[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "45cb2b33420e1b3c8a13b6a765d2b5077d9c9608" }

[dependencies]
# `no-compile`: a failed Skia prebuilt download panics instead of falling back to a source build
# (which needs clang and Python, ADR-0010). Declared here, so building this crate alone gets
# the guard too. Keep the version equal to the one Slint resolves.
skia-bindings = { version = "=0.153.3", features = ["no-compile"] }

slint = { git = "https://github.com/slint-ui/slint", rev = "45cb2b33420e1b3c8a13b6a765d2b5077d9c9608", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-skia-opengl",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
