[package]
name = "mkv-anime-batch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Batch anime fansub processing desktop application"

[lints]
workspace = true

[lib]
name = "mkv_anime_batch_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mkv-core = { path = "../../crates/mkv-core" }
mkv-desktop-core = { path = "../../crates/mkv-desktop-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[dev-dependencies]
mkv-desktop-core = { path = "../../crates/mkv-desktop-core", features = ["test-support"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
