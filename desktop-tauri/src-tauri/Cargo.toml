[package]
name = "mkv-anime-batch"
version = "1.0.0"
edition = "2021"
description = "High-performance batch anime fansub processing desktop application"

[lib]
name = "mkv_anime_batch_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mkv-core = { path = "../../crates/mkv-core" }
tauri = { version = "2", features = [] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
window-vibrancy = "0.8.0"
sysinfo = "0.33"
tempfile = "3"
tokio-util = "0.7"

[target."cfg(unix)".dependencies]
libc = "0.2"
