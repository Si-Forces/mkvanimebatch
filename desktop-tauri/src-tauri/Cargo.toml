[package]
name = "mkv-anime-batch"
version = "1.0.3"
edition = "2021"

[lib]
name = "mkv_anime_batch_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
window-vibrancy = "0.8.0"
sysinfo = "0.33"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
