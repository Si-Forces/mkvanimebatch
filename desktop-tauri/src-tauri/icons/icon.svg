<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon master: the title-bar brand mark (ui/index.html .brand-mark) on a transparent
       background, so it looks the same on any panel or theme. Regenerate the PNG/ICO/ICNS files from this file. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddbb4"/><stop offset="0.5" stop-color="#3b8cf6"/><stop offset="1" stop-color="#b05cf6"/>
    </linearGradient>
  </defs>
  <!-- The glyph spans x 2..22, y 2.5..21.2 of its 24-unit box; scale 44 centres it on the canvas. -->
  <g transform="translate(-16 -9.5) scale(44)">
    <rect x="2" y="2.5" width="20" height="14" rx="3" fill="url(#screen)"/>
    <rect x="2" y="2.5" width="20" height="5" rx="2.5" fill="#ffffff" opacity="0.14"/>
    <path d="M9.6 6.3v6.4l5.4-3.2z" fill="#ffffff"/>
    <rect x="4" y="18.8" width="9" height="2.4" rx="1.2" fill="#f0b400"/>
    <rect x="14.5" y="18.8" width="5.5" height="2.4" rx="1.2" fill="#ff6fae"/>
  </g>
</svg>
